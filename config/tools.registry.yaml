policies:
  never_expose_mcp_directly_to_parent: true
  require_trace: true

tools:
  - id: filesystem-read
    mcp_server: filesystem
    risk: low
    allowed_roles:
      - explore
      - implementer
      - reviewer
      - harness-auditor
  - id: shell-exec
    mcp_server: shell
    risk: high
    human_confirm: true
    allowed_roles:
      - implementer
      - test-writer
