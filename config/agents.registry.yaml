version: 1

# Registry field rules (enforced by harness validate-missions):
# - agent_file set → mission_template required; file must exist
# - mission_template set → file must exist (P2 may pre-stage without agent_file)
# - claude_file set → file must exist
# - P2 roles: agent_file + mission_template + soul_dir (all compile to .cursor/agents/)

defaults:
  model: inherit
  compile_mode: generated

debate_modes:
  kill-findings: "审查岗位提 finding；开发岗位用代码路径反驳 → VALID/INVALID/AMBIGUOUS"
  cross-exam: "Round2 各岗位 validate/challenge 他人 findings"
  judge-verdict: "技术评审委员 → GO/REVISE/STOP"
  score: "按 criterion 1-10 打分，<7 打回"

roles:
  # ─── 工程岗位 P1 ───
  orchestrator:
    title: 技术负责人
    soul_dir: souls/orchestrator
    agent_file: .cursor/agents/orchestrator.md
    description: "技术负责人：拆任务、委派岗位、汇总。需求模糊或跨多岗位时使用。"
    model: inherit
    readonly: false
    mission_template: templates/mission/orchestrator.mission.md
    adversary_of: [spec-judge, product-clarifier]
    debate_mode: judge-verdict
    domains: ["*"]

  explore:
    title: 技术调研工程师
    soul_dir: souls/explore
    agent_file: .cursor/agents/explore.md
    description: "技术调研工程师：深度只读审计。代码库分层、依赖、违规扫描。"
    model: inherit
    readonly: true
    mission_template: templates/mission/explore.mission.md
    adversary_of: []
    debate_mode: kill-findings
    domains: ["*"]

  implementer:
    title: 开发工程师
    soul_dir: souls/implementer
    agent_file: .cursor/agents/implementer.md
    description: "开发工程师：ad-hoc 实现与修 bug。已有明确规格或 exec-plan 时使用。"
    model: inherit
    readonly: false
    mission_template: templates/mission/implementer.mission.md
    adversary_of: [reviewer, harness-auditor]
    debate_mode: kill-findings
    domains: ["*"]

  reviewer:
    title: 代码审查工程师
    soul_dir: souls/reviewer
    agent_file: .cursor/agents/reviewer.md
    description: "代码审查工程师：逻辑、命名、错误处理、测试覆盖。P2 基座，路由给专审角色。"
    model: inherit
    readonly: true
    mission_template: templates/mission/reviewer.mission.md
    adversary_of: [implementer, test-writer, moderator]
    debate_mode: kill-findings
    domains: ["*"]

  test-writer:
    title: 测试开发工程师
    soul_dir: souls/test-writer
    agent_file: .cursor/agents/test-writer.md
    description: "测试开发工程师：补充行为测试与边界测试（ad-hoc，无 Spec）。"
    model: inherit
    readonly: false
    mission_template: templates/mission/test-writer.mission.md
    adversary_of: [reviewer]
    debate_mode: cross-exam
    domains: ["*"]

  doc-gardener:
    title: 文档工程师（P1 准入，计划日落）
    soul_dir: souls/doc-gardener
    agent_file: .cursor/agents/doc-gardener.md
    description: "文档工程师：扫 stale 文档与断链。日落计划：迁移到 CI + documentation-reviewer（P2）。"
    model: inherit
    readonly: true
    mission_template: templates/mission/doc-gardener.mission.md
    adversary_of: []
    debate_mode: kill-findings
    domains: ["*"]
    phase: P1-sunset

  harness-auditor:
    title: 架构治理工程师
    soul_dir: souls/harness-auditor
    agent_file: .cursor/agents/harness-auditor.md
    description: "架构治理工程师：分层边界、GC、harness check。纯约束检查，无对敲对手。"
    model: inherit
    readonly: true
    mission_template: templates/mission/harness-auditor.mission.md
    adversary_of: []
    debate_mode: kill-findings
    domains: ["*"]

  # ─── SDD 规格岗位 P1 ───
  spec-requirements:
    title: 需求分析师
    soul_dir: souls/spec/requirements
    agent_file: .cursor/agents/spec-requirements.md
    claude_file: .claude/agents/sdd/spec-requirements.md # handwritten until compile --target claude (P2)
    description: "需求分析师：编写/修订 requirements（EARS）。SDD 第一步。"
    workflow: sdd
    model: inherit
    readonly: false
    mission_template: templates/mission/spec-requirements.mission.md
    adversary_of: [spec-judge]
    debate_mode: judge-verdict

  spec-design:
    title: 系统架构师
    soul_dir: souls/spec/design
    agent_file: .cursor/agents/spec-design.md
    claude_file: .claude/agents/sdd/spec-design.md # handwritten until compile --target claude (P2)
    description: "系统架构师：编写/修订 design。需求已批准后。"
    workflow: sdd
    model: inherit
    readonly: false
    mission_template: templates/mission/spec-design.mission.md
    adversary_of: [spec-judge, solution-fit-challenger, architecture-reviewer]
    debate_mode: judge-verdict

  spec-tasks:
    title: 迭代规划师
    soul_dir: souls/spec/tasks
    agent_file: .cursor/agents/spec-tasks.md
    claude_file: .claude/agents/sdd/spec-tasks.md # handwritten until compile --target claude (P2)
    description: "迭代规划师：编写/修订 tasks 清单。设计已批准后。"
    workflow: sdd
    model: inherit
    readonly: false
    mission_template: templates/mission/spec-tasks.mission.md
    adversary_of: [spec-judge, implementer, impact-reviewer]
    debate_mode: judge-verdict

  spec-impl:
    title: 特性开发工程师
    soul_dir: souls/spec/impl
    agent_file: .cursor/agents/spec-impl.md
    claude_file: .claude/agents/sdd/spec-impl.md # handwritten until compile --target claude (P2)
    description: "特性开发工程师：按 tasks.md 的 task_id 实现代码。可与 spec-test 并行。"
    workflow: sdd
    model: inherit
    readonly: false
    mission_template: templates/mission/spec-impl.mission.md
    adversary_of: [reviewer, test-writer, security-reviewer]
    debate_mode: kill-findings
    can_parallel_with: [spec-test]

  spec-test:
    title: 测试工程师
    soul_dir: souls/spec/test
    agent_file: .cursor/agents/spec-test.md
    claude_file: .claude/agents/sdd/spec-test.md # handwritten until compile --target claude (P2)
    description: "测试工程师：按规格验证与补测试。可与 spec-impl 并行。"
    workflow: sdd
    model: inherit
    readonly: false
    mission_template: templates/mission/spec-test.mission.md
    adversary_of: [reviewer]
    debate_mode: cross-exam
    can_parallel_with: [spec-impl]

  spec-judge:
    title: 技术评审委员
    soul_dir: souls/spec/judge
    agent_file: .cursor/agents/spec-judge.md
    claude_file: .claude/agents/sdd/spec-judge.md # handwritten until compile --target claude (P2)
    description: "技术评审委员：对照 Spec 五问裁决 GO/REVISE/STOP。多关卡（需求/设计/任务后）。"
    workflow: sdd
    model: inherit
    readonly: true
    mission_template: templates/mission/spec-judge.mission.md
    adversary_of: [orchestrator]
    debate_mode: judge-verdict

  # ─── 横切岗位 P2 ───
  security-reviewer:
    title: 安全工程师
    extends: reviewer
    soul_dir: souls/security-reviewer
    agent_file: .cursor/agents/security-reviewer.md
    description: "安全工程师：信任边界、注入、密钥、加密。"
    readonly: true
    mission_template: templates/mission/security-reviewer.mission.md
    adversary_of: [implementer, spec-impl]
    debate_mode: kill-findings
    specialization: "信任边界、密钥管理、注入防护、加密策略"
    phase: P2

  architecture-reviewer:
    title: 架构评审工程师
    extends: reviewer
    soul_dir: souls/architecture-reviewer
    agent_file: .cursor/agents/architecture-reviewer.md
    description: "架构评审工程师：LAYERS、模式、重复抽象、接口设计。"
    readonly: true
    mission_template: templates/mission/architecture-reviewer.mission.md
    adversary_of: [implementer, spec-design]
    debate_mode: kill-findings
    specialization: "分层边界、设计模式、重复代码抽象、模块接口"
    phase: P2

  impact-reviewer:
    title: 变更影响分析师
    extends: reviewer
    soul_dir: souls/impact-reviewer
    agent_file: .cursor/agents/impact-reviewer.md
    description: "变更影响分析师：破坏性 API、依赖方、迁移路径。"
    readonly: true
    mission_template: templates/mission/impact-reviewer.mission.md
    adversary_of: [implementer, spec-design, spec-tasks]
    debate_mode: kill-findings
    specialization: "API 兼容性、依赖方影响、迁移策略"
    phase: P2

  observability-reviewer:
    title: 可观测性工程师
    extends: reviewer
    soul_dir: souls/observability-reviewer
    agent_file: .cursor/agents/observability-reviewer.md
    description: "可观测性工程师：日志、指标、追踪、告警。"
    readonly: true
    mission_template: templates/mission/observability-reviewer.mission.md
    adversary_of: [implementer, spec-impl]
    debate_mode: kill-findings
    specialization: "日志结构、指标定义、分布式追踪、告警规则"
    phase: P2

  solution-fit-challenger:
    title: 方案评审工程师
    extends: reviewer
    soul_dir: souls/solution-fit-challenger
    agent_file: .cursor/agents/solution-fit-challenger.md
    description: "方案评审工程师：挑战方案合理性（实现正确但方向错）。"
    readonly: true
    mission_template: templates/mission/solution-fit-challenger.mission.md
    adversary_of: [spec-design, implementer, spec-impl]
    debate_mode: cross-exam
    specialization: "方案合理性、产品方向对齐、技术决策权衡"
    phase: P2

  documentation-reviewer:
    title: 文档审查工程师
    soul_dir: souls/documentation-reviewer
    agent_file: .cursor/agents/documentation-reviewer.md
    description: "文档审查工程师：内容准确性、完整性、可用性、可运行示例验证。doc-gardener 日落后的接替角色。"
    readonly: true
    mission_template: templates/mission/documentation-reviewer.mission.md
    adversary_of: [implementer, spec-impl]
    debate_mode: kill-findings
    phase: P2

  performance-reviewer:
    title: 性能工程师
    extends: reviewer
    soul_dir: souls/performance-reviewer
    agent_file: .cursor/agents/performance-reviewer.md
    description: "性能工程师：N+1、热路径复杂度、内存泄漏、阻塞 I/O、大 payload。"
    readonly: true
    mission_template: templates/mission/performance-reviewer.mission.md
    adversary_of: [implementer, spec-impl]
    debate_mode: kill-findings
    specialization: "查询效率、热路径优化、内存管理、异步阻塞检查"
    phase: P2

  # ─── 设计岗位 P2 ───
  ui-designer:
    title: UI 设计师
    soul_dir: souls/ui-designer
    agent_file: .cursor/agents/ui-designer.md
    description: "UI 设计师：编写/修订 ui-design.md 视觉设计系统（tokens + 设计说明）。"
    readonly: false
    mission_template: templates/mission/ui-designer.mission.md
    adversary_of: [implementer, spec-impl]
    debate_mode: kill-findings
    phase: P2

  # ─── 交付岗位 P2 ───
  product-clarifier:
    title: 产品经理
    soul_dir: souls/product-clarifier
    agent_file: .cursor/agents/product-clarifier.md
    description: "产品经理：Spec 五问前的需求澄清与 scope 收敛。"
    readonly: false
    mission_template: templates/mission/product-clarifier.mission.md
    adversary_of: [orchestrator, spec-requirements]
    debate_mode: judge-verdict
    phase: P2

  ci-investigator:
    title: CI 工程师
    soul_dir: souls/ci-investigator
    agent_file: .cursor/agents/ci-investigator.md
    description: "CI 工程师：单条 check 失败根因与修复建议。"
    readonly: true
    mission_template: templates/mission/ci-investigator.mission.md
    adversary_of: [implementer, spec-impl]
    debate_mode: kill-findings
    phase: P2

  pr-shepherd:
    title: 发布工程师
    soul_dir: souls/pr-shepherd
    agent_file: .cursor/agents/pr-shepherd.md
    description: "发布工程师：PR 至 merge-ready（CI、评论、冲突、权限）。"
    readonly: true
    mission_template: templates/mission/pr-shepherd.mission.md
    adversary_of: [reviewer, moderator]
    debate_mode: cross-exam
    phase: P2

  moderator:
    title: 评审主席
    soul_dir: souls/moderator
    agent_file: .cursor/agents/moderator.md
    description: "评审主席：多审查意见汇总去重、输出统一 checklist。"
    readonly: true
    mission_template: templates/mission/moderator.mission.md
    adversary_of: [reviewer, pr-shepherd]
    debate_mode: judge-verdict
    phase: P2
